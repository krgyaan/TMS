server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            stream: stream
            content: log
            container_name: attrs.container.name
      - labels:
          stream:
          container_name:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: content

  - job_name: tms-api
    static_configs:
      - targets: [localhost]
        labels:
          job: tms-api
          __path__: /logs/tms-api-*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - structured_metadata:
          {}

  - job_name: tms-worker
    static_configs:
      - targets: [localhost]
        labels:
          job: tms-worker
          __path__: /logs/tms-worker-*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - structured_metadata:
          {}