server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            stream: stream
            content: log
            container_name: attrs.container.name
      - json:
          expressions:
            service_name: service_name
            service: service
            event_type: event_type
            action: action
          source: content
      - labels:
          stream:
          container_name:
          service_name:
          service:
          event_type:
          action:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: content

  - job_name: volksAi
    static_configs:
      - targets: [localhost]
        labels:
          job: volksAi
          service_name: volksAi
          __path__: /logs/volksAi*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service_name: service_name
            service: service
            request_id: request_id
            event_type: event_type
            action: action
      - labels:
          level:
          service_name:
          event_type:
          action:
      - timestamp:
          source: timestamp
          format: RFC3339
      - structured_metadata:
          {}

  - job_name: tms-api
    static_configs:
      - targets: [localhost]
        labels:
          job: tms-api
          service_name: tms-api
          __path__: /logs/tms-api-*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            event_type: event_type
            action: action
            tenderId: tenderId
      - labels:
          level:
          service_name:
          event_type:
          action:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - structured_metadata:
          {}

  - job_name: tms-worker
    static_configs:
      - targets: [localhost]
        labels:
          job: tms-worker
          service_name: tms-worker
          __path__: /logs/tms-worker-*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            event_type: event_type
            action: action
            tenderId: tenderId
      - labels:
          level:
          service_name:
          event_type:
          action:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - structured_metadata:
          {}